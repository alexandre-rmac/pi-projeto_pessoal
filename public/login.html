<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Forja | Login</title>

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/components/form.css">
    <link rel="stylesheet" href="/css/pages/login.css">
    <link rel="stylesheet" href="/css/modal.css">
    
    <link rel="icon" href="/assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com">

    <script src="https://kit.fontawesome.com/79924d81b1.js" crossorigin="anonymous"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/fetch/fetchLoad.js" defer></script>
    <script src="/js/components/modal.js" defer></script>
    <script src="/js/login.js" defer></script>

</head>

<body>
    <div id="navbar-container"></div>
    
    <section class="login">
        <div class="login-container">
            <!-- Restaurada a div form-container para segurar o padding-left de 50% -->
            <div class="form-container">
                <form id="form-login" class="form-container-interior" novalidate>
                    <p class="form-subtitulo">BEM-VINDO DE VOLTA</p>
                    <h3 class="form-titulo">Entrar</h3>
                    <p class="form-descricao">Acesse sua conta para ver e editar sua coleção.</p>
                    
                    <div class="form-campo">
                        <p class="form-campo-nome">E-mail</p>
                        <input id="email_input" class="form-campo-input" type="email" placeholder="Digite seu email cadastrado">
                    </div>
                    
                    <div class="form-campo">
                        <p class="form-campo-nome">Senha</p>
                        <input id="senha_input" class="form-campo-input" type="password" placeholder="*******">
                    </div>
                    
                    <button type="submit" id="btn_entrar" class="form-btn-entrar">
                        <i class="fa-solid fa-arrow-right-long"></i>
                        Entrar
                    </button>
                    
                    <div class="form-line-ou">
                        <span class="traco longo"></span>
                        <p class="form-ou">OU</p>
                        <span class="traco longo"></span>
                    </div>
                    
                    <div class="form-criar-container">
                        <p class="form-descricao">
                            Ainda não tem conta?
                            <a href="cadastro.html">Criar conta</a>
                        </p>
                    </div>
                    
                    <div class="form-footer">
                        <i class="fa-solid fa-fingerprint"></i>
                        <p class="form-descricao">Seu deck, no seu espaço</p>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loading-spinner"></div>
    </div>

    <div id="modal-alerta" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="modal-titulo"></h3>
            <div id="modal-mensagem"></div>
            <div id="modal-botoes"></div>
        </div>
    </div>
</body>
</html>
