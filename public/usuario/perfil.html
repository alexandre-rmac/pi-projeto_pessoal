<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alramac - Seu Perfil</title>

    <script src="/js/navbar.js"></script>
    <script src="https://kit.fontawesome.com/79924d81b1.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/pages/perfil.css">

    <link rel="icon" href="/assets/icon/favicon2.ico">

</head>

<body>
    <div id="navbar-container"></div>

    <section class="perfil">
        <div class="perfil-intro">
            <div class="perfil-titulo-container">
                <p class="subtitulo">SEUS DECKS</p>
                <h3 class="titulo">Perfil</h3>
                <p class="descricao">Veja seus decks cadastrados e um resumo rápido da sua coleção.</p>
            </div>
            <a href="/usuario/criar-deck.html" class="btn"><i class="fa-solid fa-plus"></i> Criar Deck</a>
        </div>
        <div class="resumo">
            <div class="resumo-kpi">
                <p class="kpi-titulo">Indicadores da coleção</p>
                <div class="kpi-total-container">
                    <p class="kpi-total">Total de decks</p>
                    <p id="total_decks" class="total-decks-numero">2</p>
                </div>
                <div class="kpi-cores">
                    <p class="kpi-cores">Cores Favoritas</p>
                    <div class="kpi-cores-favoritas">
                        <div id="cores_favoritas" class="kpi-cores-exibicao">
                            VERDE
                        </div>
                    </div>
                    <div class="kpi-status">
                        <div class="kpi-status-completos">
                            <span class="circulo"></span>
                            <p class="status-completos">Completos</p>
                            <span id="kpi-completos">1</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="resumo-grafico">
                grafico
            </div>
        </div>



    </section>
</body>

</html>
